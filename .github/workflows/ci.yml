name: CI
description: "General CI code check. Runs on every PR"

on:
  pull_request:
    types: [ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
     UV_INDEX_EQTY_USERNAME: "ci_runner"
     UV_INDEX_EQTY_PASSWORD: ${{ secrets.UV_INDEX_EQTY_PASSWORD }}

    steps:
      - name: Install Nix
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
        continue-on-error: true

      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: just sync

      - name: Format
        id: format
        continue-on-error: true
        run: just fmt

      - name: Lint
        id: lint
        continue-on-error: true
        run: just lint

      - name: Build
        id: build
        continue-on-error: true
        run: just build

      - name: Summarize checks
        if: always()
        run: |
          {
            echo "## CI results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Format | ${{ steps.format.outcome == 'success' && '🟢 Passed' || '🔴 Failed' }} |"
            echo "| Lint | ${{ steps.lint.outcome == 'success' && '🟢 Passed' || '🔴 Failed' }} |"
            echo "| Build | ${{ steps.build.outcome == 'success' && '🟢 Passed' || '🔴 Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if a check failed
        if: always() && (steps.format.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.build.outcome == 'failure')
        run: exit 1
