name: CI
description: "General CI code check. Runs on every PR"

on:
  pull_request:
    # `opened` matters: without it a pull request created directly as ready-for-review gets no run at
    # all until someone pushes to it, and reads as "no checks" rather than "not checked yet".
    # `reopened` covers a PR closed and brought back, which likewise produces no synchronize event.
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --command bash -e {0}

# Three jobs rather than one sequential job, so Python feedback does not wait behind Rust. Measured
# on run 34253208393: lint 387s, release build 107s and still going when cancelled, tests never
# reached. Almost all of that is compiling two deliberately incompatible Rust dependency graphs --
# `integrity` for the plugin, Relay's core for `abi-test` -- from scratch, since nothing caches
# cargo artifacts between runs. Clippy never lints those dependencies; it only needs their types.
#
# The honest cost of the split: `rust-lint` and `rust-test` no longer share the debug dependency
# build they shared inside one job, so total CPU nearly doubles to buy roughly 90s of wall clock.
# Collapsing them back into one `rust` job that runs `just lint-rust && just test-rust` is the
# cheaper shape if CPU minutes matter more than latency; caching cargo would make the question moot.
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # Vestigial: `eqty-sdk` now resolves from public PyPI and nothing in this workspace reads the
      # private index. Kept until PR #17's `eqty-lineage-vnim` -- which still pins
      # `eqty-sdk = { index = "eqty" }` -- either merges or drops that pin, so whichever lands first
      # does not break `uv sync` on main.
      UV_INDEX_EQTY_USERNAME: ${{ secrets.EQTY_PYPI_USERNAME }}
      UV_INDEX_EQTY_PASSWORD: ${{ secrets.EQTY_PYPI_PASSWORD }}
    steps:
      - name: Install Nix
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Cachix
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
        continue-on-error: true
      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: just sync
      - name: Format
        run: just fmt-check-python
      - name: Lint
        run: just lint-python
      - name: Test
        run: just test-python
      # Wheels only. The cargo release build is `just build-relay`, deliberately off the PR path --
      # see that recipe for what does and does not cover it.
      - name: Build
        run: just build-python

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Cachix
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
        continue-on-error: true
      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4
      - name: Format
        run: just fmt-check-rust
      - name: Lint
        run: just lint-rust

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Cachix
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
        continue-on-error: true
      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4
      # This job ran out of disk, not time: `No space left on device` while compiling
      # `netlink-packet-route`. `just test-rust` needs the plugin's dependency tree, `abi-test`'s
      # separate one, and a third for the cdylib `abi-test` dlopens -- three full trees with iroh and
      # ssi in two of them. `build_cdylib` used to make a fresh one per test, which was the fourth;
      # that is fixed in the test itself. This buys headroom for the three that remain, and prints
      # `df` either side so the next failure says whether space was still the problem.
      - name: Free runner disk
        shell: bash -e {0}
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1
      - name: Test
        run: just test-rust

  # One place to read the outcome. Parallel jobs already fail the run on their own -- this exists so
  # the run summary names which of the three failed without opening each job. `if: always()` is what
  # makes it report a failure rather than being skipped by one.
  summary:
    runs-on: ubuntu-latest
    needs: [python, rust-lint, rust-test]
    if: always()
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Summarize checks
        run: |
          {
            echo "## CI results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Python | ${{ needs.python.result == 'success' && '🟢 Passed' || '🔴 Failed' }} |"
            echo "| Rust lint | ${{ needs['rust-lint'].result == 'success' && '🟢 Passed' || '🔴 Failed' }} |"
            echo "| Rust tests | ${{ needs['rust-test'].result == 'success' && '🟢 Passed' || '🔴 Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if a check failed
        if: needs.python.result != 'success' || needs['rust-lint'].result != 'success' || needs['rust-test'].result != 'success'
        run: exit 1
