name: Release
description: "Publishes package to pypi server on a release"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Package release tag (for example, eqty-lineage-langchain@1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id || inputs.release_tag }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  publish:
    # `eqty-lineage-nemo-relay` is a Rust cdylib with no `pyproject.toml`, so this workflow cannot
    # release it and `release-relay-plugin.yml` does. Skipped rather than left to fail: the tag
    # resolution below ends in "Expected one pyproject.toml, found 0", which reads as a broken
    # release rather than as the wrong workflow for the tag.
    if: ${{ !startsWith(github.event.release.tag_name || inputs.release_tag, 'eqty-lineage-nemo-relay@') }}
    runs-on: ubuntu-latest

    steps:
      - name: Install Nix
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
        continue-on-error: true

      - name: Check out repository
        uses: eqtylab-actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          package="${RELEASE_TAG%@*}"
          version="${RELEASE_TAG##*@}"

          if [[ "$package" == "$RELEASE_TAG" || "$package" == *"@"* || "$version" == *"@"* || ! "$package" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)[1-9][0-9]*)?$ ]]; then
            echo "Release tag must use PACKAGE@MAJOR.MINOR.PATCH or a PEP 440 prerelease suffix (for example, eqty-lineage-vnim@0.1.0rc1): $RELEASE_TAG" >&2
            exit 1
          fi

          mapfile -t pyprojects < <(
          python3 - "$package" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          package = sys.argv[1]
          for path in Path(".").rglob("pyproject.toml"):
              with path.open("rb") as file:
                  if tomllib.load(file).get("project", {}).get("name") == package:
                      print(path)
          PY
          )

          if [[ ${#pyprojects[@]} -ne 1 ]]; then
            echo "Expected one pyproject.toml for package '$package', found ${#pyprojects[@]}" >&2
            exit 1
          fi

          sed -i -E "s/^version = \"[^\"]*\"$/version = \"$version\"/" "${pyprojects[0]}"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build package
        run: just build-package "$PACKAGE"

      - name: Publish package
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.EQTY_PYPI_USERNAME }}
          UV_PUBLISH_PASSWORD: "${{ secrets.EQTY_PYPI_PASSWORD }}"
        run: just publish-package "$PACKAGE"
