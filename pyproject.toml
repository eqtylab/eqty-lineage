[project]
name = "eqty-lineage"
version = "0.0.0"
description = "EQTY lineage integrations workspace."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eqty-lineage-langchain",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
eqty-lineage-langchain = { workspace = true }
eqty-sdk = { index = "eqty" }

[[tool.uv.index]]
name = "eqty"
url = "https://pypi.eqtylab.io/simple/"
publish-url = "https://pypi.eqtylab.io/"
explicit = true

[tool.mypy]
python_executable = ".venv/bin/python"

[tool.ruff]
line-length = 120

# Pinning ruff linting for consistency between local checks & CI checks
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
