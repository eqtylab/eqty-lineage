[project]
name = "eqty-lineage"
version = "0.0.0"
description = "EQTY lineage integrations workspace."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eqty-lineage-langchain",
    "eqty-lineage-deepagents",
    "eqty-lineage-vnim",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "deepagents",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]
# `eqty-lineage-nemo-relay` is a Rust cdylib loaded through a C ABI, not a Python distribution: it has
# a Cargo.toml and no pyproject.toml. The glob above matches it anyway, and uv treats a member without
# a pyproject.toml as an error rather than skipping it -- so `uv sync` failed outright, which is
# `just sync`, which is the first step of CI.
exclude = ["packages/eqty-lineage-nemo-relay"]

[tool.uv.sources]
eqty-lineage-langchain = { workspace = true }
eqty-lineage-deepagents = { workspace = true }
eqty-lineage-vnim = { workspace = true }
eqty-sdk = { index = "eqty" }

# `eqty-sdk` resolves from public PyPI. The index below stays because `just publish` publishes our
# own packages through it; it is a publish target, not a source for dependencies.
[[tool.uv.index]]
name = "eqty"
url = "https://pypi.eqtylab.io/simple/"
publish-url = "https://pypi.eqtylab.io/"
explicit = true

[tool.pytest.ini_options]
# Anchors rootdir at the workspace root, so the shared `sdk` fixture in the root conftest.py stays in
# scope even when pytest is invoked from inside one package's directory.
testpaths = [
    "packages/eqty-lineage-langchain/tests",
    "packages/eqty-lineage-deepagents/tests",
    "packages/eqty-lineage-vnim/tests",
]

[tool.mypy]
python_executable = ".venv/bin/python"

[tool.ruff]
line-length = 120

# Pinning ruff linting for consistency between local checks & CI checks
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
