# OpenShell sandbox policy for the eqty-langchain-agent image.
#
# The agent's only egress is OpenAI chat completions from the image's Python interpreter. Attach the
# built-in `openai` provider so OPENAI_API_KEY is a placeholder the proxy resolves at api.openai.com;
# the real key never enters the sandbox.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
    - /app
    - /opt/venv
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies:
  openai_chat:
    name: openai-chat-completions
    endpoints:
      - host: api.openai.com
        port: 443
        # Must stay an inspected protocol: credential placeholders are only rewritten on inspected traffic.
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    binaries:
      # Policy matches /proc/<pid>/exe, which resolves the venv's python symlink to the base interpreter.
      - path: /usr/local/bin/python3.12
