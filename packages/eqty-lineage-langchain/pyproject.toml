[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "eqty-lineage-langchain"
version = "0.0.0"
description = "EQTY lineage callback handler for LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eqty-sdk>=2.4.0",
    "langchain-core>=0.3",
    "rfc8785>=0.1",
]

[tool.uv.build-backend]
# flat layout (module dir at package root, no src/); dotted name = namespace package
module-root = ""
module-name = "eqty_lineage.langchain"
