[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "eqty-lineage-langchain"
version = "0.0.0"
description = "EQTY lineage callback handler for LangChain and LangGraph."
readme = "README.md"
# 3.10, one floor below the workspace's own: this package imports nothing newer, and both its
# dependencies (eqty-sdk, langchain-core) support 3.10, so there is no reason to make a consumer still
# on 3.10 upgrade in order to record lineage. Verified against a real 3.10 interpreter, not just declared.
requires-python = ">=3.10"
dependencies = [
    "eqty-sdk",
    "langchain-core>=0.3",
]

[tool.uv.sources]
eqty-sdk = { index = "eqty" }

[[tool.uv.index]]
name = "eqty"
url = "https://pypi.eqtylab.io/simple/"
publish-url = "https://pypi.eqtylab.io/"
explicit = true

[tool.uv.build-backend]
# flat layout (module dir at package root, no src/); dotted name = namespace package
module-root = ""
module-name = "eqty_lineage.langchain"
