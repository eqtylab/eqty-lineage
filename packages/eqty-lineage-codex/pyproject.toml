[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "eqty-lineage-codex"
version = "0.1.0"
description = "Minimal signed lineage capture for Codex hook events."
requires-python = ">=3.11"
dependencies = ["eqty-sdk"]

[project.scripts]
eqty-codex-lineage = "eqty_lineage.codex.__main__:main"

[tool.uv.sources]
eqty-sdk = { index = "eqty" }

[[tool.uv.index]]
name = "eqty"
url = "https://pypi.eqtylab.io/simple/"
explicit = true

[tool.uv.build-backend]
module-root = ""
module-name = "eqty_lineage.codex"
