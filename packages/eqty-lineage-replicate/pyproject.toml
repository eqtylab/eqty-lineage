[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "eqty-lineage-replicate"
version = "0.1.0"
description = "Run an agent task N times and report which artifacts survived its nondeterminism."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eqty-lineage-core>=0.1",
    "eqty-lineage-query>=0.1",
    "eqty-lineage-transcript",
]

[project.scripts]
eqty-lineage-replicate = "eqty_lineage.replicate.__main__:main"

[tool.uv.sources]
eqty-lineage-core = { workspace = true }
eqty-lineage-query = { workspace = true }
eqty-lineage-transcript = { workspace = true }
eqty-sdk = { index = "eqty" }

[[tool.uv.index]]
name = "eqty"
url = "https://pypi.eqtylab.io/simple/"
publish-url = "https://pypi.eqtylab.io/legacy/"
explicit = true

[tool.uv.build-backend]
# flat layout (module dir at package root, no src/); dotted name = namespace package
module-root = ""
module-name = "eqty_lineage.replicate"
