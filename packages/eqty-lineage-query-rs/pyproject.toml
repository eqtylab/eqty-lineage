[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "eqty-lineage-query-rs"
version = "0.1.0"
description = "Native accelerator for eqty-lineage-query's semiring Datalog evaluator."
readme = "README.md"
requires-python = ">=3.11"

[tool.maturin]
# One abi3 wheel per platform covers every supported Python, rather than one per minor version.
features = ["pyo3/extension-module"]
# Top-level module rather than nesting inside the eqty_lineage namespace package: maturin
# would ship an __init__.py for the nested form, and no package in this workspace may do that.
module-name = "eqty_lineage_query_rs"

[tool.uv]
# Rebuild the extension when the Rust sources change, not only when pyproject does.
cache-keys = [{ file = "Cargo.toml" }, { file = "src/**/*.rs" }]
