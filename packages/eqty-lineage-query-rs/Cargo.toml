[package]
name = "eqty-lineage-query-rs"
version = "0.0.0"
edition = "2021"
description = "Native accelerator for eqty-lineage-query's semiring Datalog evaluator."
publish = false

[lib]
name = "eqty_lineage_query_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py311", "extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
