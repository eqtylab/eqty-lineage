[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "eqty-lineage-vnim"
version = "0.1.0rc1"
description = "LangChain chat model client for EQTY VNIM's OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "eqty-sdk>=2.4.2",
    "httpx>=0.27",
    "langchain-openai==1.3.5",
]

# `eqty-sdk` resolves from public PyPI (2.3.1rc1 is published there). The index below is a publish
# target for this package, not a source for its dependencies.
[[tool.uv.index]]
name = "eqty"
url = "https://pypi.eqtylab.io/simple/"
publish-url = "https://pypi.eqtylab.io/"
explicit = true

[tool.uv.build-backend]
module-root = ""
module-name = "eqty_lineage.vnim"
