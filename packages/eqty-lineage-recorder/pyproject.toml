[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "eqty-lineage-recorder"
version = "0.0.0"
description = "Framework-agnostic lineage recorder shared by the EQTY lineage integrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Floor, not decoration: the recorder is written against behaviour that is specific to this line --
    # `Signer.new(_load_if_exists=)`, statement CIDs covering a credential with `validFrom`, and the
    # un-chunked statement_graph_link query whose variable limit `agent_hooks.session` catches by name.
    # Verified against 2.2.0.
    "eqty-sdk>=2.2,<3",
]

[tool.uv.sources]
eqty-sdk = { index = "eqty" }

[[tool.uv.index]]
name = "eqty"
url = "https://pypi.eqtylab.io/simple/"
publish-url = "https://pypi.eqtylab.io/"
explicit = true

[tool.uv.build-backend]
# flat layout (module dir at package root, no src/); dotted name = namespace package
module-root = ""
module-name = "eqty_lineage.recorder"
