[package]
name = "eqty-lineage-nemo-relay-abi-test"
version = "0.0.0"
edition = "2024"
publish = false
description = "Loads the eqty-lineage-nemo-relay cdylib through Relay's dynamic-plugin host."

# Its own workspace, and its own lockfile, on purpose.
#
# This crate must not share the plugin's dependency graph. `integrity` turns on serde_json's
# `arbitrary_precision` through `ssi`, and cargo unifies features across a graph, so the Relay host
# under test would serialize and decode with a feature no real gateway has.
#
# Splitting them costs nothing real: this crate needs no `integrity`, and the plugin needs no
# `nemo-relay` core -- `nemo-relay-plugin` re-exports the types it uses.
[workspace]

[lib]
path = "src/lib.rs"

[dev-dependencies]
nemo-relay = "0.11.1"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
