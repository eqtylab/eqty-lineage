# NeMo Relay plugin manifest for the EQTY lineage recorder.
#
# Two traps live in this file, both from name collisions:
#
#   * `[plugin] id` must equal the string `plugin_kind()` returns in `src/lib.rs`, and it is what
#     `components[].kind` refers to in a host's `plugins.toml`. `[plugin] kind` is a different thing
#     entirely -- the execution model Relay uses to load us.
#   * `[integrity] sha256` is NVIDIA's digest of the built artifact. It has nothing to do with the
#     EQTY `integrity` crate this plugin links against. Do not conflate them.
#
# `[source] artifact` and `[load] library` must stay aligned, and both are per-platform. CI generates
# the digest and fails the build if this file disagrees with the artifact: a stale digest is an
# install Relay refuses, and that should be caught before release rather than by a user.
#
# THIS FILE IS A TEMPLATE. It is never installed from where it sits.
#
# `nemo-relay` copies the ENTIRE DIRECTORY CONTAINING THIS MANIFEST into an activation snapshot,
# recursively, against a 512 MiB budget -- `copy_snapshot_directory(manifest_directory, ..)` in the
# CLI's `plugins/lifecycle`. Installed from the package root the "runtime closure" is `src/`,
# `tests/`, `target/` and `abi-test/target/` (11 GB here), and the gateway refuses to start with an
# error naming some unrelated rlib. The paths below are bare filenames, relative to a staging
# directory holding only the dylib, its signature, and the config schema; `just nemo-relay-package`
# builds that. It also signs: activation hardens `attestation` to `signature_required`, so an
# unsigned plugin installs cleanly and then refuses to start.

manifest_version = 1

[plugin]
id = "eqty.lineage"
kind = "rust_dynamic"

[compat]
relay = ">=0.8.0,<1.0"
native_api = "1"

# Relay requires a native plugin to default to disabled. Enabling is an explicit host decision.
[defaults]
enabled = false

[capabilities]
items = ["plugin_native", "config_schema"]

[config_schema]
path = "config.schema.json"

[source]
artifact = "libeqty_lineage_nemo_relay.dylib"

[integrity]
sha256 = "sha256:<digest of source.artifact -- written by `just nemo-relay-package`>"

[load]
library = "libeqty_lineage_nemo_relay.dylib"
symbol = "nemo_relay_register_plugin"
