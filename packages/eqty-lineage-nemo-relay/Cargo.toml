[package]
name = "eqty-lineage-nemo-relay"
version = "0.0.0"
edition = "2024"
publish = false
description = "Records a NeMo Relay session as a signed EQTY lineage manifest."
license = "Apache-2.0"

# A standalone workspace: the repository around it is a uv/Python workspace, and cargo must not try
# to inherit from a parent it would never find.
[workspace]

[lib]
name = "eqty_lineage_nemo_relay"
# cdylib is what `kind = "rust_dynamic"` loads through the C ABI; rlib is what `tests/` links.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The plugin authoring SDK. It re-exports `Event` and the rest of `nemo-relay-types`, so depending on
# Relay's core crate as well would only add a second copy of the same types.
nemo-relay-plugin = "0.11.1"
# The EQTY core. Pinned by SHA rather than tag so the build cannot move underneath us; this is
# v0.0.21. `Cargo.lock` is committed and the package recipe builds `--locked`. See README.
integrity = { git = "https://github.com/eqtylab/integrity", rev = "13af564f0061d7b15819efc99bccef5b6140a1ad", default-features = false, features = ["cid", "jsonld", "vc", "dsse", "lineage", "signer-ed25519", "blob-local", "blob-memory"] }
anyhow = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde_json = "1"
uuid = "1"
# Fetches provider manifests. Both are already in the tree through `integrity`, at these versions
# and with these features, so naming them adds no crate to the build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
# Fixtures are ATOF JSON Lines captured from a real session; the tests deserialize them into `Event`
# through `decode_event`, exactly as the subscriber does.
serde_json = "1"
# The ABI load test lives in `abi-test/`, as its own crate: it needs Relay's core crate, which
# must not share a dependency graph with `integrity`. See `abi-test/Cargo.toml`.
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Manifest blobs are base64; the recorder tests decode them to read what was actually attested.
base64 = "0.22"
