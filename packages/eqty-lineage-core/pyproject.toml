[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "eqty-lineage-core"
version = "0.0.0"
description = "Framework-agnostic lineage recorder shared by the EQTY lineage integrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eqty-sdk",
]

[tool.uv.sources]
eqty-sdk = { index = "eqty" }

[[tool.uv.index]]
name = "eqty"
url = "https://pypi.eqtylab.io/simple/"
publish-url = "https://pypi.eqtylab.io/legacy/"
explicit = true

[tool.uv.build-backend]
# flat layout (module dir at package root, no src/); dotted name = namespace package
module-root = ""
module-name = "eqty_lineage.core"
